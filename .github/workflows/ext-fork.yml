name: Fork checks and upstream trial

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
  # GitHub only enables this schedule when this workflow is on the default branch.
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ext-fork-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'qilanai/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GOWORK: 'off'

    steps:
      - name: Checkout fork
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch --no-tags upstream main
          git update-ref refs/remotes/upstream/main FETCH_HEAD

      - name: Test fork tooling
        run: python3 -B -m unittest discover -s ext/tools -p 'test_*.py' -v

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Check registered fork changes
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python3 ext/tools/upstream.py check --report "$RUNNER_TEMP/fork-report.md"

      - name: Check current fork
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: bash ext/tools/verify.sh all

      - name: Trial upstream merge and verify
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 ext/tools/upstream.py trial --verify --report "$RUNNER_TEMP/fork-report.md"

      - name: Publish check report
        if: always()
        env:
          FORK_JOB_STATUS: ${{ job.status }}
        run: |
          if [ -f "$RUNNER_TEMP/fork-report.md" ]; then
            cat "$RUNNER_TEMP/fork-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nWorkflow job status: %s\n' "$FORK_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
